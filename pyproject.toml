[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-video-editor"
version = "0.1.0"
description = "Headless analysis and render worker for Gradivo"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "ffmpeg-python>=0.2",
    "noisereduce>=3.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-openai>=1.1",
    "langgraph>=0.4",
    "elevenlabs>=2.40",
    "rapidfuzz>=3.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "langsmith>=0.7.22",
    "boto3>=1.35",
    "google-api-python-client>=2.136",
    "google-auth>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "typer>=0.12",
]

[project.scripts]
ai-video-worker = "ai_video_editor.worker.app:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_video_editor"]
